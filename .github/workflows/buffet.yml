name: Buffet-Liste aktualisieren
on:
  schedule:
    - cron: "23 * * * *"   # jede Stunde zur Minute 23
  workflow_dispatch:        # erlaubt einen Testlauf per Knopfdruck
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zusagen aus Tally holen
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
        run: python scripts/update_buffet.py
      - name: Speichern, falls sich etwas geändert hat
        run: |
          git config user.name "buffet-bot"
          git config user.email "buffet-bot@users.noreply.github.com"
          git add buffet.json
          git diff --cached --quiet || (git commit -m "Buffet-Liste aktualisiert" && git push)
